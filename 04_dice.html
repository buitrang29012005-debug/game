<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 스네이크 게임 (Snake Game)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #4ecca3;
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
        }

        /* 게임 캔버스 */
        #gameCanvas {
            background-color: #16213e;
            border: 4px solid #0f3460;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        /* 모바일 컨트롤러 */
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-areas: 
                ". up ."
                "left down right";
            gap: 8px;
        }

        .btn-ctrl {
            width: 55px;
            height: 55px;
            background-color: #0f3460;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .btn-ctrl:active {
            background-color: #4ecca3;
            color: #1a1a2e;
        }

        #btn-up { grid-area: up; }
        #btn-left { grid-area: left; }
        #btn-right { grid-area: right; }
        #btn-down { grid-area: down; }

        /* 게임 오버 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: #16213e;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.4);
        }

        .restart-btn {
            margin-top: 20px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #1a1a2e;
            background-color: #4ecca3;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .restart-btn:hover {
            background-color: #3bb38f;
        }
    </style>
</head>
<body>

    <h1>🐍 SNAKE GAME</h1>
    <div class="score-board">
        <div>현재 점수: <span id="score">0</span></div>
        <div>최고 점수: <span id="high-score">0</span></div>
    </div>

    <!-- 메인 게임 화면 -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- 모바일 화면용 가상 방향키 -->
    <div class="controls">
        <button class="btn-ctrl" id="btn-up">▲</button>
        <button class="btn-ctrl" id="btn-left">◀</button>
        <button class="btn-ctrl" id="btn-right">▶</button>
        <button class="btn-ctrl" id="btn-down">▼</button>
    </div>

    <!-- 게임 오버 창 -->
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>최종 점수: <span id="final-score">0</span></p>
            <button class="restart-btn" onclick="resetGame()">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const modal = document.getElementById('game-over-modal');

        // 게임 설정값
        const GRID_SIZE = 20; // 한 칸 크기 (20px)
        const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20 칸

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = GRID_SIZE; // 이동 방향 X (기본: 오른쪽)
        let dy = 0;         // 이동 방향 Y
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameLoop = null;
        let isChangingDirection = false; // 프레임당 한 번만 방향 전환 허용

        highScoreEl.textContent = highScore;

        // 게임 시작/초기화
        function resetGame() {
            snake = [
                { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 9 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 8 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            scoreEl.textContent = score;
            modal.style.display = 'none';

            spawnFood();

            if (gameLoop) clearInterval(gameLoop);
            // 120ms마다 게임 업데이트 (숫자가 작을수록 속도가 빨라짐)
            gameLoop = setInterval(update, 120);
        }

        // 음식(사과) 생성
        function spawnFood() {
            while (true) {
                food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
                food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

                // 뱀의 몸통 위에는 음식이 생기지 않도록 예외 처리
                let onSnake = snake.some(segment => segment.x === food.x && segment.y === food.y);
                if (!onSnake) break;
            }
        }

        // 매 프레임 업데이트
        function update() {
            isChangingDirection = false;

            // 1. 뱀 머리 이동 위치 계산
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 2. 벽 충돌 감지
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return gameOver();
            }

            // 3. 자기 자신과 충돌 감지
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return gameOver();
                }
            }

            // 머리 추가
            snake.unshift(head);

            // 4. 음식 먹었는지 체크
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snake_high_score', highScore);
                }
                spawnFood();
            } else {
                // 음식을 먹지 않았다면 꼬리 제거 (길이 유지)
                snake.pop();
            }

            // 5. 화면 그리기
            draw();
        }

        // 화면 렌더링
        function draw() {
            // 배경 지우기
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 음식 그리기 (빨간색)
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.arc(food.x + GRID_SIZE / 2, food.y + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 뱀 그리기 (초록색)
            snake.forEach((segment, index) => {
                // 머리는 약간 더 밝은 색상
                ctx.fillStyle = index === 0 ? '#4ecca3' : '#339977';
                ctx.fillRect(segment.x + 1, segment.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
        }

        // 방향 전환 로직
        function changeDirection(newDx, newDy) {
            if (isChangingDirection) return;

            // 반대 방향으로 직접 회전 방지 (예: 오른쪽으로 가다 왼쪽 키 입력)
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;

            dx = newDx;
            dy = newDy;
            isChangingDirection = true;
        }

        // 키보드 조작 이벤트
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection(0, -GRID_SIZE);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection(0, GRID_SIZE);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection(-GRID_SIZE, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection(GRID_SIZE, 0);
                    break;
            }
        });

        // 모바일/터치 조작 버튼 이벤트
        document.getElementById('btn-up').addEventListener('click', () => changeDirection(0, -GRID_SIZE));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection(0, GRID_SIZE));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection(-GRID_SIZE, 0));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection(GRID_SIZE, 0));

        // 게임 오버
        function gameOver() {
            clearInterval(gameLoop);
            document.getElementById('final-score').textContent = score;
            modal.style.display = 'flex';
        }

        // 초기 시작
        resetGame();
    </script>
</body>
</html>
